# Copy this file to config.yaml and adjust the hosts to match your ~/.ssh/config.
default_cluster: killarney

# How the server reaches the clusters:
#   auto     - paramiko on Windows, openssh elsewhere (default)
#   openssh  - reuse a 2FA-backed ControlMaster session you start with `ssh -MNf <host>`
#              (Linux, macOS, WSL). Set ssh_command to ["wsl", "ssh"] if the master lives in WSL.
#   paramiko - the server holds the connection itself; call the cluster_login tool and
#              approve the Duo push on your phone. Works on native Windows.
ssh_backend: auto
ssh_command:
  - ssh
# Optional overrides for the paramiko backend (defaults: ~/.ssh/config, ~/.ssh/known_hosts).
# ssh_config: ~/.ssh/config
# known_hosts: ~/.ssh/known_hosts
# Answer sent to the Duo prompt when no passcode is given ("1" = push to first device).
duo_option: "1"
keepalive_seconds: 60

# Local JSONL audit log for remote actions. Set to null to disable.
audit_log: .slurm-mcp-audit.jsonl

# Local SQLite record of projects, jobs, syncs, and background tasks, read by
# project_status and project_history. Relative to this file; null disables it.
# Point every MCP client (Claude Code, Codex, ...) at this config to share it.
state_db: .slurm-mcp-state.sqlite3

# Local directories that upload_file, download_file, and sync_local_commits may use.
# Defaults to the server's working directory (normally your project).
# local_roots:
#   - D:/Projects/my-paper

# Cap for upload_file, download_file, and git bundles.
max_transfer_bytes: 200000000

# Enables run_remote_command: any bash command on a login node, as a last resort
# when no dedicated tool fits. Each command is shown to you for approval first
# (through MCP elicitation; clients that cannot prompt are refused), and clearly
# destructive commands are refused even when approved. Off by default.
allow_remote_shell: false
# DANGEROUS: true lets agents run shell commands WITHOUT asking you first.
# Anything a prompt-injected or mistaken agent decides to run, runs under your
# account. The built-in denylist is a seatbelt, not a sandbox. Keep this false
# unless you fully trust the session and are watching it.
remote_shell_auto_approve: false

cluster_defaults:
  docs:
    - docs/alliance-canada.md
  policies:
    allow_conda: false
    allow_docker: false
    require_modules: true
    python_env: virtualenv
    no_heavy_login_node_commands: true
    # Most Alliance clusters have no internet on compute nodes. When false, jobs get
    # HF_HUB_OFFLINE=1 / TRANSFORMERS_OFFLINE=1 / HF_DATASETS_OFFLINE=1 alongside HF_HOME.
    compute_node_internet: false
  python:
    # Lmod module that provides Python; extra modules are loaded after it.
    module: python/3.11
    modules: []
    # Default virtualenv name under storage.venv_root. "{project}" gives each project
    # its own venv; without a selected project it falls back to "default".
    venv_name: "{project}"
  setup_hints:
    python_virtualenv:
      - module load python/3.11
      - virtualenv --no-download $VENV_PATH
      - source $VENV_PATH/bin/activate
      - pip install --no-index --upgrade pip
      - pip install --no-index -r requirements.txt
    job_script:
      - load required modules inside the Slurm script
      - activate the project virtualenv inside the Slurm script
      - write logs and checkpoints under scratch or project storage
  slurm:
    submit_command: sbatch
    status_command: squeue
    accounting_command: sacct
    # Supported values: gres, gpus, gpus_per_node.
    gpu_request_style: gres
    # Added as --account when a profile does not set one. See the slurm_accounts tool.
    # default_account: def-yourpi
    # Account for jobs that request no GPUs, if it differs (e.g. when default_account
    # is a GPU-only RAC allocation such as rrg-yourpi on one cluster).
    # cpu_account: def-yourpi
    # Extra environment variables for every job (passed with --export=ALL,...).
    # job_env:
    #   OMP_NUM_THREADS: "1"
  # Storage paths are templates. Placeholders: {user} and {cluster} from the cluster
  # entry, {project} from the selected project (project_use or project=...), and
  # any other storage key, such as {workspace_root} below. Paths that use
  # {project} resolve per project, so one config serves every project, and a new
  # project needs no config edit: remote_git_clone or sync_local_commits creates it.
  storage:
    preferred_work_root: scratch
    # One folder per project. project_list(cluster=...) scans this folder.
    workspace_root: /project/def-yourpi/{user}/code
    remote_repo: "{workspace_root}/{project}"
    # Keep run outputs outside the repo: untracked files there make remote_git_pull
    # and remote_git_checkout refuse to run. Scratch is large but purged.
    run_root: /scratch/{user}/runs/{project}
    # Virtualenvs hold many small files; keep them out of scratch (purged) and
    # watch the file-count quota wherever you put them.
    venv_root: /home/{user}/venvs
    # Shared Hugging Face cache, read by jobs through HF_HOME. Shared on purpose.
    hf_home: /project/def-yourpi/{user}/hf
    # Background tasks (setup_venv, hf_download). Without {project} their status
    # stays readable after switching projects. Defaults to run_root/mcp-tasks.
    tasks_root: /scratch/{user}/.slurm-mcp/tasks
    # Copies of project records for project_record_sync (one small JSON file per
    # project). Defaults to /home/{user}/.slurm-mcp/records; home is backed up.
    # record_root: /home/{user}/.slurm-mcp/records

clusters:
  killarney:
    host: killarney
    user: your_cc_username
    docs:
      - https://docs.alliancecan.ca/wiki/Killarney

  narval:
    host: narval
    user: your_cc_username
    docs:
      - https://docs.alliancecan.ca/wiki/Narval

  trillium:
    host: trillium
    user: your_cc_username
    docs:
      - https://docs.alliancecan.ca/wiki/Trillium

  vulcan:
    host: vulcan
    user: your_cc_username
    docs:
      - https://docs.alliancecan.ca/wiki/Vulcan
    # A cluster can override any storage template, e.g. a different allocation:
    # storage:
    #   workspace_root: /project/def-otherpi/{user}/code

# Project selected when the server starts. project_use switches at runtime.
# default_project: my-paper

# Optional per-project settings. Projects do not need to be listed here; list one
# to describe it or to point it at a checkout that does not follow the templates.
# projects:
#   old-paper:
#     description: Camera-ready runs for the 2025 paper.
#     clusters:
#       narval:
#         storage:
#           remote_repo: /project/def-yourpi/{user}/old-paper

profiles:
  debug_gpu:
    description: Short interactive-scale GPU smoke test.
    time: "00:30:00"
    gpus: 1
    cpus_per_task: 4
    mem: 32G

  train_gpu:
    description: Standard single-GPU training run.
    time: "12:00:00"
    gpus: 1
    cpus_per_task: 8
    mem: 64G
    # Per-profile job environment, merged after cluster job_env.
    # env:
    #   TOKENIZERS_PARALLELISM: "false"
